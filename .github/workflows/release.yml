name: Build and Release

on:
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: Publish as a prerelease
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SELF_UPDATE_URL: https://github.com/erdemkulunk/emporion
      SELF_UPDATE_ASSET_REGEX: '^emporion-.*-universal\.apk$'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/emporion-release.jks
          {
            printf 'storeFile=emporion-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed release APKs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          rm -rf dist
          mkdir dist
          flutter build apk --release --flavor normal \
            --dart-define=SELF_UPDATE_URL="$SELF_UPDATE_URL" \
            --dart-define=SELF_UPDATE_ASSET_REGEX="$SELF_UPDATE_ASSET_REGEX"
          cp build/app/outputs/flutter-apk/app-normal-release.apk \
            "dist/emporion-$VERSION-universal.apk"
          flutter build apk --release --split-per-abi --flavor normal \
            --dart-define=SELF_UPDATE_URL="$SELF_UPDATE_URL" \
            --dart-define=SELF_UPDATE_ASSET_REGEX="$SELF_UPDATE_ASSET_REGEX"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-normal-release.apk \
            "dist/emporion-$VERSION-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-normal-release.apk \
            "dist/emporion-$VERSION-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-normal-release.apk \
            "dist/emporion-$VERSION-x86_64.apk"
          (cd dist && sha256sum emporion-*.apk > SHA256SUMS)

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emporion-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ inputs.beta }}
          draft: false
          generate_release_notes: true
          files: dist/*
